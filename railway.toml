# Railway — Dockerfile orqali Vue + FastAPI
# https://docs.railway.com/guides/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Migratsiya: faqat Release Command (masalan alembic upgrade head), start da emas
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
